<section class="entity-panel">
  <div class="entity-panel-header">
    <div>
      <div class="eyebrow">{{ rows().length }} bản ghi</div>
      <h2>Môn học</h2>
      <p>Quản lý môn học, số tín chỉ và số tiết.</p>
    </div>
    <div class="header-buttons">
      <button type="button" class="export-button" (click)="exportCsv()">Xuất file</button>
      <button type="button" class="add-button" (click)="openCreate()">Thêm mới</button>
    </div>
  </div>

  @if (message()) {
    <div class="entity-alert">{{ message() }}</div>
  }

  <div class="entity-table">
    <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" (edit)="openEdit($event)" (remove)="deleteSubject($event)" />
  </div>

  @if (formOpen()) {
    <app-entity-form
      [title]="editingRow() ? 'Sửa môn học' : 'Thêm môn học'"
      [fields]="formFields()"
      [initialValues]="editingRow() ?? {}"
      [saving]="saving()"
      (cancel)="closeForm()"
      (save)="saveSubject($event)"
    />
  }
</section>
