<section class="students-panel">
  <div class="students-panel-header">
    <div>
      <div class="eyebrow">{{ filteredRows().length }} / {{ rows().length }} bản ghi</div>
      <h2>Sinh viên</h2>
      <p>Quản lý hồ sơ sinh viên, thông tin lớp và trạng thái tài khoản.</p>
    </div>
    <div class="header-buttons">
      <button type="button" class="export-button" (click)="exportCsv()">Xuất file</button>
      @if (canCreate()) {
        <button type="button" class="add-button" (click)="openCreate()">Thêm sinh viên</button>
      }
    </div>
  </div>

  @if (message()) {
    <div class="students-alert">{{ message() }}</div>
  }

  <div class="students-filter">
    <label for="student-search">Tìm kiếm MSSV hoặc họ tên</label>
    <input
      id="student-search"
      type="search"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
      (keyup.enter)="searchStudents()"
      placeholder="Nhập mã sinh viên hoặc tên sinh viên"
    />
    <div class="search-actions">
      <button type="button" class="search-button" (click)="searchStudents()">Tìm kiếm</button>
      <button type="button" class="refresh-button" (click)="resetSearch()">Làm mới</button>
    </div>
  </div>

  <div class="students-table">
    <app-data-table
      [columns]="columns"
      [rows]="filteredRows()"
      [loading]="loading()"
      [canEdit]="canEdit()"
      [canDelete]="canDelete()"
      (edit)="openEdit($event)"
      (remove)="deleteStudent($event)"
    />
  </div>

  @if (formOpen()) {
    <app-entity-form
      [title]="editingRow() ? 'Sửa sinh viên' : 'Thêm sinh viên'"
      [fields]="formFields()"
      [initialValues]="editingRow() ?? {}"
      [saving]="saving()"
      (cancel)="closeForm()"
      (save)="saveStudent($event)"
    />
  }
</section>
