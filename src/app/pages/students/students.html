<section class="students-panel">
  <div class="students-panel-header">
    <div>
      <div class="eyebrow">{{ rows().length }} bản ghi</div>
      <h2>Sinh viên</h2>
      <p>Quản lý hồ sơ sinh viên, thông tin lớp và trạng thái tài khoản.</p>
    </div>
    <div class="header-buttons">
      <button type="button" class="export-button" (click)="exportCsv()">Xuất file</button>
      <button type="button" class="add-button" (click)="openCreate()">Thêm sinh viên</button>
    </div>
  </div>

  @if (message()) {
    <div class="students-alert">{{ message() }}</div>
  }

  <div class="students-toolbar">
    <div>
      <strong>Danh sách sinh viên</strong>
      <span>Dữ liệu sinh viên từ EduCore API</span>
    </div>
    <span class="status-pill">{{ loading() ? 'Đang tải' : 'Sẵn sàng' }}</span>
  </div>

  <div class="students-table">
    <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" (edit)="openEdit($event)" (remove)="deleteStudent($event)" />
  </div>

  @if (formOpen()) {
    <app-entity-form
      [title]="editingRow() ? 'Sửa sinh viên' : 'Thêm sinh viên'"
      [fields]="formFields()"
      [initialValues]="editingRow() ?? {}"
      [saving]="saving()"
      (cancel)="closeForm()"
      (save)="saveStudent($event)"
    />
  }
</section>
