<div class="table-responsive border rounded-3 bg-white">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        @for (column of columns(); track column) {
          <th class="text-uppercase small text-secondary fw-bold">{{ column }}</th>
        }
        <th class="text-end text-uppercase small text-secondary fw-bold">Thao tac</th>
      </tr>
    </thead>
    <tbody>
      @if (loading()) {
        <tr>
          <td [attr.colspan]="columns().length + 1" class="text-center text-secondary py-5">
            Dang tai du lieu...
          </td>
        </tr>
      } @else if (rows().length) {
        @for (row of rows(); track $index) {
          <tr>
            @for (column of columns(); track column) {
              <td>{{ row[column] ?? '-' }}</td>
            }
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-outline-primary" (click)="edit.emit(row)">Sua</button>
            </td>
          </tr>
        }
      } @else {
        <tr>
          <td [attr.colspan]="columns().length + 1" class="text-center text-secondary py-5">
            {{ emptyText() }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
