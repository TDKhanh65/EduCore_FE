<div class="form-backdrop">
  <form class="entity-form" (ngSubmit)="submit()">
    <div class="entity-form-header">
      <h3>{{ title() }}</h3>
      <button type="button" class="close-button" (click)="cancel.emit()">×</button>
    </div>

    <div class="entity-form-grid">
      @for (field of safeFields(); track field.key) {
        <label class="field-row">
          <span>{{ field.label }}</span>
          @if (field.type === 'boolean') {
            <select
              [name]="field.key"
              [disabled]="field.readonly ?? false"
              [ngModel]="values()[field.key] ?? true"
              (ngModelChange)="setValue(field.key, $event === 'true')"
            >
              <option value="true">Đang hoạt động</option>
              <option value="false">Tạm dừng</option>
            </select>
          } @else if (field.type === 'select') {
            <select
              [name]="field.key"
              [required]="field.required ?? false"
              [disabled]="field.readonly ?? false"
              [ngModel]="values()[field.key] ?? ''"
              (ngModelChange)="setValue(field.key, $event === '' ? null : +$event)"
            >
              <option value="">-- Chọn --</option>
              @for (option of safeOptions(field); track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          } @else {
            <input
              [name]="field.key"
              [type]="field.type"
              [required]="field.required ?? false"
              [min]="field.min ?? null"
              [readonly]="field.readonly ?? false"
              [ngModel]="values()[field.key] ?? ''"
              (ngModelChange)="setValue(field.key, field.type === 'number' ? ($event === '' ? null : +$event) : $event)"
            />
          }
        </label>
      }
    </div>

    <div class="entity-form-actions">
      <button type="button" class="secondary-button" (click)="cancel.emit()">Hủy</button>
      <button type="submit" class="primary-button" [disabled]="saving()">
        {{ saving() ? 'Đang lưu...' : 'Lưu' }}
      </button>
    </div>
  </form>
</div>
